name: VIP AI Studio — synthetic Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/repair-mega15-16-final-ci-20261104]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vip-ai-studio-synthetic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate1-synthetic:
    name: Gate-1 model-free / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/gate0.lock

      - name: Install synthetic test dependencies only
        run: |
          python -m pip install --disable-pip-version-check -r requirements/gate0.lock
          python -m pip install --disable-pip-version-check 'jsonschema==4.26.0' 'numpy>=2.3,<3' 'pillow>=11.1,<13'

      - name: Check Python syntax
        run: python -m compileall -q src experiments tests

      - name: Run LAB receipt contract tests
        env:
          PYTHONPATH: src:experiments:scripts
          PYTHONDONTWRITEBYTECODE: '1'
          LAB_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          LAB_PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          LAB_PR_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          LAB_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          LAB_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LAB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LAB_PR_MERGE_SHA: ${{ github.sha }}
        run: python -m pytest -q tests/scripts/test_lab_synthetic_receipt.py

      - name: Run bounded Gate-1 and product-path synthetic regressions
        env:
          PYTHONPATH: src:experiments:scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest -q \
            experiments/persistent_local_index/tests/test_model_profile.py \
            experiments/persistent_local_index/tests/test_siglip2_native.py \
            experiments/persistent_local_index/tests/test_siglip2_session.py \
            tests/gate1/compat/test_three_arm_compat.py \
            tests/vip_fvs/unit/test_semantic_index.py \
            tests/vip_fvs/unit/test_local_semantic.py \
            tests/vip_fvs/unit/test_query_modality.py \
            tests/vip_fvs/integration/test_product_index_query.py \
            tests/vip_fvs/integration/test_multi_source_retrieval.py

      - name: Run CORE-02 query-driven semantic report tests
        env:
          PYTHONPATH: src:experiments:scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest -q \
            tests/vip_fvs/unit/test_core_report.py \
            tests/vip_fvs/unit/test_core_analysis.py \
            tests/vip_fvs/integration/test_core_analyze_local_cli.py

      - name: Run AI Studio three-profile acceptance tests (when delivered)
        if: hashFiles('tests/vip_fvs/integration/test_three_profile_product_path.py') != ''
        env:
          PYTHONPATH: src:experiments:scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest -q tests/vip_fvs/integration/test_three_profile_product_path.py

      - name: Check MEGA-02 deliverables when development files are present
        run: |
          delivered=0
          for file in \
            src/vip_fvs/query_batch.py \
            src/vip_fvs/synthetic_profiles.py \
            src/vip_fvs/batch_retrieval.py \
            src/vip_fvs/three_arm_batch.py \
            src/vip_fvs/batch_report.py \
            tests/vip_fvs/unit/test_query_batch_contract.py \
            tests/vip_fvs/integration/test_batch_retrieval_three_arm.py \
            tests/vip_fvs/integration/test_batch_cli_synthetic.py; do
            if [[ -f "$file" ]]; then delivered=1; fi
          done
          if [[ "$delivered" -eq 1 ]]; then
            for file in \
              src/vip_fvs/query_batch.py \
              src/vip_fvs/synthetic_profiles.py \
              src/vip_fvs/batch_retrieval.py \
              src/vip_fvs/three_arm_batch.py \
              src/vip_fvs/batch_report.py \
              tests/vip_fvs/unit/test_query_batch_contract.py \
              tests/vip_fvs/integration/test_batch_retrieval_three_arm.py \
              tests/vip_fvs/integration/test_batch_cli_synthetic.py; do
              if [[ ! -f "$file" ]]; then
                echo "::error::MEGA-02 is incomplete: missing $file"
                exit 1
              fi
            done
          else
            echo "MEGA-02 is not submitted; existing synthetic suite remains active."
          fi

      - name: Test MEGA-02 multi-source batch and three-arm synthetic lab
        if: hashFiles('src/vip_fvs/query_batch.py') != ''
        env:
          PYTHONPATH: src:experiments:scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest -q \
            tests/vip_fvs/unit/test_query_batch_contract.py \
            tests/vip_fvs/integration/test_batch_retrieval_three_arm.py \
            tests/vip_fvs/integration/test_batch_cli_synthetic.py

      - name: Check MEGA-03–07 lab wave completeness
        shell: bash
        run: |
          check_wave() {
            local wave="$1"; shift
            local seen=0
            for file in "$@"; do
              if [[ -f "$file" ]]; then seen=1; fi
            done
            if [[ "$seen" -eq 0 ]]; then
              echo "MEGA-$wave: NOT_SUBMITTED"
              return 0
            fi
            for file in "src/vip_lab/__init__.py" "src/vip_lab/common.py" "$@"; do
              if [[ ! -f "$file" ]]; then
                echo "::error::MEGA-$wave partial delivery: $file missing"
                return 1
              fi
            done
            echo "MEGA-$wave: DELIVERED_UNVERIFIED"
          }
          check_wave 03 \
            "src/vip_lab/mega03/__init__.py" \
            "src/vip_lab/mega03/s5_preflight.py" \
            "src/vip_lab/mega03/stream_identity_preflight.py" \
            "src/vip_lab/mega03/review_bundle_check.py" \
            "tests/vip_lab/test_mega03.py"
          check_wave 04 \
            "src/vip_lab/mega04/__init__.py" \
            "src/vip_lab/mega04/d2_readiness.py" \
            "src/vip_lab/mega04/query_review_preflight.py" \
            "src/vip_lab/mega04/experiment_readiness.py" \
            "tests/vip_lab/test_mega04.py"
          check_wave 05 \
            "src/vip_lab/mega05/__init__.py" \
            "src/vip_lab/mega05/model_assets.py" \
            "src/vip_lab/mega05/runtime_authority.py" \
            "src/vip_lab/mega05/benchmark_entry.py" \
            "tests/vip_lab/test_mega05.py"
          check_wave 06 \
            "src/vip_lab/mega06/__init__.py" \
            "src/vip_lab/mega06/workload_plan.py" \
            "src/vip_lab/mega06/recovery_matrix.py" \
            "src/vip_lab/mega06/measurement_review.py" \
            "tests/vip_lab/test_mega06.py"
          check_wave 07 \
            "src/vip_lab/mega07/__init__.py" \
            "src/vip_lab/mega07/candidate_temporal_gate.py" \
            "src/vip_lab/mega07/editorial_lineage.py" \
            "src/vip_lab/mega07/qc_export_readiness.py" \
            "tests/vip_lab/test_mega07.py"

          check_cross_gate() {
            local seen=0
            for file in "src/vip_lab/integration.py" "src/vip_lab/cli.py" "tests/vip_lab/test_cross_gate_integration.py" "tests/vip_lab/test_lab_cli.py"; do
              if [[ -f "$file" ]]; then seen=1; fi
            done
            if [[ "$seen" -eq 0 ]]; then
              echo "MEGA-CROSS-GATE: NOT_SUBMITTED"
              return 0
            fi
            for file in "src/vip_lab/integration.py" "src/vip_lab/cli.py" "tests/vip_lab/test_cross_gate_integration.py" "tests/vip_lab/test_lab_cli.py"; do
              if [[ ! -f "$file" ]]; then
                echo "::error::MEGA-CROSS-GATE partial delivery: $file missing"
                return 1
              fi
            done
            echo "MEGA-CROSS-GATE: DELIVERED_UNVERIFIED"
          }
          check_cross_gate

      - name: Test MEGA-03 synthetic lab preparation
        id: mega03
        continue-on-error: true
        if: hashFiles('tests/vip_lab/test_mega03.py') != ''
        env:
          PYTHONPATH: src:experiments:scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q tests/vip_lab/test_mega03.py

      - name: Test MEGA-04 synthetic lab preparation
        id: mega04
        continue-on-error: true
        if: hashFiles('tests/vip_lab/test_mega04.py') != ''
        env:
          PYTHONPATH: src:experiments:scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q tests/vip_lab/test_mega04.py

      - name: Test MEGA-05 synthetic lab preparation
        id: mega05
        continue-on-error: true
        if: hashFiles('tests/vip_lab/test_mega05.py') != ''
        env:
          PYTHONPATH: src:experiments:scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q tests/vip_lab/test_mega05.py

      - name: Test MEGA-06 synthetic lab preparation
        id: mega06
        continue-on-error: true
        if: hashFiles('tests/vip_lab/test_mega06.py') != ''
        env:
          PYTHONPATH: src:experiments:scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q tests/vip_lab/test_mega06.py

      - name: Test MEGA-07 synthetic lab preparation
        id: mega07
        continue-on-error: true
        if: hashFiles('tests/vip_lab/test_mega07.py') != ''
        env:
          PYTHONPATH: src:experiments:scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q tests/vip_lab/test_mega07.py

      - name: Test MEGA-03–07 cross-gate lab integration
        id: mega_cross
        continue-on-error: true
        if: hashFiles('tests/vip_lab/test_cross_gate_integration.py') != ''
        env:
          PYTHONPATH: src:experiments:scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest -q \
            tests/vip_lab/test_cross_gate_integration.py \
            tests/vip_lab/test_lab_cli.py

      - name: Enforce complete MEGA-03–07 CI status
        if: always()
        env:
          M03: ${{ steps.mega03.outcome }}
          M04: ${{ steps.mega04.outcome }}
          M05: ${{ steps.mega05.outcome }}
          M06: ${{ steps.mega06.outcome }}
          M07: ${{ steps.mega07.outcome }}
          MCROSS: ${{ steps.mega_cross.outcome }}
        run: |
          echo "MEGA-03=$M03 MEGA-04=$M04 MEGA-05=$M05 MEGA-06=$M06 MEGA-07=$M07 CROSS=$MCROSS"
          for outcome in "$M03" "$M04" "$M05" "$M06" "$M07" "$MCROSS"; do
            if [[ "$outcome" == "failure" ]]; then
              echo "::error::One or more MEGA wave suites failed; inspect earlier steps"
              exit 1
            fi
          done

      - name: Check MEGA-08–14 submitted wave completeness
        id: mega0814complete
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          check_wave() {
            local wave="$1"; shift
            local seen=0
            for file in "$@"; do
              [[ -f "$file" ]] && seen=1 || true
            done
            if [[ "$seen" -eq 0 ]]; then
              echo "MEGA-$wave: NOT_SUBMITTED"
              return 0
            fi
            if [[ ! -f docs/ai-studio-tasks/MEGA_08_14_PROGRESS.md ]]; then
              echo "::error::MEGA-$wave: missing durable progress ledger"
              return 1
            fi
            for file in "$@"; do
              if [[ ! -f "$file" ]]; then
                echo "::error::MEGA-$wave: incomplete submission, missing $file"
                return 1
              fi
            done
            echo "MEGA-$wave: DELIVERED_UNVERIFIED"
          }
          check_wave 08 \
            "src/vip_lab/mega08/__init__.py" \
            "src/vip_lab/mega08/capability_inventory.py" \
            "src/vip_lab/mega08/contract_gate.py" \
            "src/vip_lab/mega08/gap_digest.py" \
            "tests/vip_lab/test_mega08.py"
          check_wave 09 \
            "src/vip_lab/mega09/__init__.py" \
            "src/vip_lab/mega09/candidate_queue.py" \
            "src/vip_lab/mega09/queue_validation.py" \
            "src/vip_lab/mega09/review_intake.py" \
            "tests/vip_lab/test_mega09.py"
          check_wave 10 \
            "src/vip_lab/mega10/__init__.py" \
            "src/vip_lab/mega10/temporal_request.py" \
            "src/vip_lab/mega10/pts_fixture_diagnostics.py" \
            "src/vip_lab/mega10/measurement_boundary.py" \
            "tests/vip_lab/test_mega10.py"
          check_wave 11 \
            "src/vip_lab/mega11/__init__.py" \
            "src/vip_lab/mega11/editorial_proposal.py" \
            "src/vip_lab/mega11/proposal_revisions.py" \
            "src/vip_lab/mega11/decision_boundary.py" \
            "tests/vip_lab/test_mega11.py"
          check_wave 12 \
            "src/vip_lab/mega12/__init__.py" \
            "src/vip_lab/mega12/replay_graph.py" \
            "src/vip_lab/mega12/fault_scenarios.py" \
            "src/vip_lab/mega12/consistency_review.py" \
            "tests/vip_lab/test_mega12.py"
          check_wave 13 \
            "src/vip_lab/mega13/__init__.py" \
            "src/vip_lab/mega13/qc_readiness.py" \
            "src/vip_lab/mega13/lineage_audit.py" \
            "src/vip_lab/mega13/release_blockers.py" \
            "tests/vip_lab/test_mega13.py"
          check_wave 14 \
            "src/vip_lab/mega14/__init__.py" \
            "src/vip_lab/mega14/scenario.py" \
            "src/vip_lab/mega14/orchestrator.py" \
            "src/vip_lab/mega14/report.py" \
            "src/vip_lab/mega14/cli.py" \
            "tests/vip_lab/test_mega14.py" \
            "tests/vip_lab/test_mega08_14_end_to_end.py"

      - name: Test MEGA-08 synthetic integration
        id: mega08
        continue-on-error: true
        if: ${{ hashFiles('tests/vip_lab/test_mega08.py') != '' }}
        env:
          PYTHONPATH: src:experiments:scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest -q \
            tests/vip_lab/test_mega08.py

      - name: Test MEGA-09 synthetic integration
        id: mega09
        continue-on-error: true
        if: ${{ hashFiles('tests/vip_lab/test_mega09.py') != '' }}
        env:
          PYTHONPATH: src:experiments:scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest -q \
            tests/vip_lab/test_mega09.py

      - name: Test MEGA-10 synthetic integration
        id: mega10
        continue-on-error: true
        if: ${{ hashFiles('tests/vip_lab/test_mega10.py') != '' }}
        env:
          PYTHONPATH: src:experiments:scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest -q \
            tests/vip_lab/test_mega10.py

      - name: Test MEGA-11 synthetic integration
        id: mega11
        continue-on-error: true
        if: ${{ hashFiles('tests/vip_lab/test_mega11.py') != '' }}
        env:
          PYTHONPATH: src:experiments:scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest -q \
            tests/vip_lab/test_mega11.py

      - name: Test MEGA-12 synthetic integration
        id: mega12
        continue-on-error: true
        if: ${{ hashFiles('tests/vip_lab/test_mega12.py') != '' }}
        env:
          PYTHONPATH: src:experiments:scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest -q \
            tests/vip_lab/test_mega12.py

      - name: Test MEGA-13 synthetic integration
        id: mega13
        continue-on-error: true
        if: ${{ hashFiles('tests/vip_lab/test_mega13.py') != '' }}
        env:
          PYTHONPATH: src:experiments:scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest -q \
            tests/vip_lab/test_mega13.py

      - name: Test MEGA-14 synthetic integration
        id: mega14
        continue-on-error: true
        if: ${{ hashFiles('tests/vip_lab/test_mega14.py') != '' }}
        env:
          PYTHONPATH: src:experiments:scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest -q \
            tests/vip_lab/test_mega14.py \
            tests/vip_lab/test_mega08_14_end_to_end.py

      - name: Enforce MEGA-08–14 wave outcomes
        if: always()
        env:
          M08_COMPLETE: ${{ steps.mega0814complete.outcome }}
          M08: ${{ steps.mega08.outcome }}
          M09: ${{ steps.mega09.outcome }}
          M10: ${{ steps.mega10.outcome }}
          M11: ${{ steps.mega11.outcome }}
          M12: ${{ steps.mega12.outcome }}
          M13: ${{ steps.mega13.outcome }}
          M14: ${{ steps.mega14.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          echo "MEGA-08–14 outcomes (unsubmitted waves SKIPPED):"
          echo "M08_COMPLETE=$M08_COMPLETE"
          echo "M08=$M08"
          echo "M09=$M09"
          echo "M10=$M10"
          echo "M11=$M11"
          echo "M12=$M12"
          echo "M13=$M13"
          echo "M14=$M14"
          for outcome in "$M08_COMPLETE" "$M08" "$M09" "$M10" "$M11" "$M12" "$M13" "$M14"; do
            if [[ "$outcome" == "failure" ]]; then
              echo "::error::MEGA-08–14 selected suite or completeness failed"
              exit 1
            fi
          done
          echo 'No submitted MEGA-08–14 suite failed. SKIPPED does not mean complete.'

      - name: Check MEGA-15–16 submitted wave completeness
        id: mega1516complete
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          check_wave() {
            local wave="$1"; shift
            local any=0
            for file in "$@"; do
              if [[ -f "$file" ]]; then any=1; fi
            done
            if [[ "$any" -eq 0 ]]; then
              echo "MEGA-$wave: NOT_SUBMITTED (not a PASS)"
              return 0
            fi
            if [[ ! -f docs/ai-studio-tasks/MEGA_15_16_PROGRESS.md ]]; then
              echo "::error::MEGA-$wave: missing durable progress ledger"
              return 1
            fi
            for file in "$@"; do
              if [[ ! -f "$file" ]]; then
                echo "::error::MEGA-$wave: missing required file $file"
                return 1
              fi
            done
            echo "MEGA-$wave: SUBMITTED_UNVERIFIED"
          }
          check_wave 15 \
            src/vip_lab/mega15/__init__.py \
            src/vip_lab/mega15/temporal_preflight.py \
            src/vip_lab/mega15/editorial_handoff.py \
            src/vip_lab/mega15/lineage.py \
            tests/vip_lab/test_mega15.py
          check_wave 16 \
            src/vip_lab/mega16/__init__.py \
            src/vip_lab/mega16/render_preflight.py \
            src/vip_lab/mega16/qc_requirements.py \
            src/vip_lab/mega16/release_refusal.py \
            src/vip_lab/mega16/cli.py \
            tests/vip_lab/test_mega16.py \
            tests/vip_lab/test_mega15_16_end_to_end.py
          if [[ -f tests/vip_lab/test_mega15_16_end_to_end.py && ! -f docs/ai-studio-tasks/MEGA_15_16_DEFERRED_REAL_PILOT_PREREQUISITES.md ]]; then
            echo "::error::MEGA-15–16: missing deferred real-pilot prerequisites"
            exit 1
          fi

      - name: Test MEGA-15 temporal/editorial synthetic preflight
        id: mega15
        if: ${{ always() && hashFiles('tests/vip_lab/test_mega15.py') != '' }}
        continue-on-error: true
        env:
          PYTHONPATH: src:experiments:scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest -q tests/vip_lab/test_mega15.py

      - name: Test MEGA-16 render/QC refusal preflight
        id: mega16
        if: ${{ always() && hashFiles('tests/vip_lab/test_mega16.py') != '' }}
        continue-on-error: true
        env:
          PYTHONPATH: src:experiments:scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest -q tests/vip_lab/test_mega16.py

      - name: Test MEGA-15–16 generated-only end-to-end contract
        id: mega1516e2e
        if: ${{ always() && hashFiles('tests/vip_lab/test_mega15_16_end_to_end.py') != '' }}
        continue-on-error: true
        env:
          PYTHONPATH: src:experiments:scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest -q tests/vip_lab/test_mega15_16_end_to_end.py

      - name: Enforce submitted MEGA-15–16 wave outcomes
        if: always()
        shell: bash
        env:
          M1516_COMPLETE: ${{ steps.mega1516complete.outcome }}
          M15: ${{ steps.mega15.outcome }}
          M16: ${{ steps.mega16.outcome }}
          M1516_E2E: ${{ steps.mega1516e2e.outcome }}
        run: |
          set -euo pipefail
          echo "M1516_COMPLETE=$M1516_COMPLETE"
          echo "M15=$M15"
          echo "M16=$M16"
          echo "M1516_E2E=$M1516_E2E"
          for outcome in "$M1516_COMPLETE" "$M15" "$M16" "$M1516_E2E"; do
            if [[ "$outcome" == "failure" ]]; then
              echo "::error::MEGA-15–16 submitted wave or completeness FAILED"
              exit 1
            fi
          done
          echo "No submitted MEGA-15–16 suite failed. SKIPPED waves are NOT verified."

      - name: Verify and run all MEGA-17 synthetic acceptance suites
        id: mega17
        if: always()
        continue-on-error: true
        env:
          PYTHONPATH: src:experiments:scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -uo pipefail
          suites=(
            tests/vip_lab/test_mega17_editorial_readiness.py
            tests/vip_lab/test_mega17_end_to_end.py
            tests/vip_lab/test_mega17_gate0_readiness.py
            tests/vip_lab/test_mega17_integration_readiness.py
            tests/vip_lab/test_mega17_release_readiness.py
            tests/vip_lab/test_mega17_source_readiness.py
          )
          suite_preflight_status=0
          for suite in "${suites[@]}"; do
            if [[ ! -f "$suite" ]]; then
              echo "::error::MEGA-17 acceptance suite is missing: $suite"
              suite_preflight_status=2
            fi
          done
          collection="$RUNNER_TEMP/mega17-collection.txt"
          report="$RUNNER_TEMP/lab-synthetic-junit.xml"
          set +e
          python -m pytest --collect-only -q "${suites[@]}" > "$collection"
          collection_status=$?
          python -m pytest -q --junitxml="$report" "${suites[@]}"
          pytest_status=$?
          set -e
          effective_status="$pytest_status"
          if [[ "$collection_status" -ne 0 ]]; then effective_status="$collection_status"; fi
          if [[ "$suite_preflight_status" -ne 0 ]]; then effective_status="$suite_preflight_status"; fi
          echo "collection_exit_status=$collection_status" >> "$GITHUB_OUTPUT"
          echo "pytest_exit_status=$pytest_status" >> "$GITHUB_OUTPUT"
          echo "exit_status=$effective_status" >> "$GITHUB_OUTPUT"

      - name: Create LAB synthetic receipt
        if: always()
        env:
          LAB_JOB_ID: gate1-synthetic-${{ matrix.python-version }}
          LAB_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          LAB_PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          LAB_PR_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          LAB_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          LAB_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LAB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LAB_PR_MERGE_SHA: ${{ github.sha }}
        run: |
          python scripts/lab_synthetic_receipt.py create \
            --collection "$RUNNER_TEMP/mega17-collection.txt" \
            --junit "$RUNNER_TEMP/lab-synthetic-junit.xml" \
            --collection-exit-status '${{ steps.mega17.outputs.collection_exit_status }}' \
            --pytest-exit-status '${{ steps.mega17.outputs.pytest_exit_status }}' \
            --exit-status '${{ steps.mega17.outputs.exit_status }}' \
            --output "$RUNNER_TEMP/lab-synthetic-receipt.json"

      - name: Validate LAB synthetic receipt
        if: always()
        run: python scripts/lab_synthetic_receipt.py validate "$RUNNER_TEMP/lab-synthetic-receipt.json"

      - name: Verify LAB receipt against evidence bytes
        if: always()
        env:
          LAB_JOB_ID: gate1-synthetic-${{ matrix.python-version }}
          LAB_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          LAB_PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          LAB_PR_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          LAB_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          LAB_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LAB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LAB_PR_MERGE_SHA: ${{ github.sha }}
        run: |
          python scripts/lab_synthetic_receipt.py verify-evidence \
            "$RUNNER_TEMP/lab-synthetic-receipt.json" \
            --collection "$RUNNER_TEMP/mega17-collection.txt" \
            --junit "$RUNNER_TEMP/lab-synthetic-junit.xml"

      - name: Enforce MEGA-17 receipt PASS status
        if: always()
        run: |
          python - "$RUNNER_TEMP/lab-synthetic-receipt.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          receipt = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if receipt.get("status") != "PASS" or receipt.get("exit_status") != 0:
              print("::error::LAB synthetic MEGA-17 receipt is not PASS")
              raise SystemExit(1)
          print("LAB synthetic receipt PASS; canonical-history status is independent and unchanged.")
          PY

      - name: Upload LAB synthetic job evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-synthetic-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/lab-synthetic-receipt.json
            ${{ runner.temp }}/lab-synthetic-junit.xml
            ${{ runner.temp }}/mega17-collection.txt
          if-no-files-found: error
