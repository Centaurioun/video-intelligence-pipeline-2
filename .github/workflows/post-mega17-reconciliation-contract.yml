name: Post-MEGA-17 reconciliation contract tests

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/post-mega17-reconciliation-contract.yml
      - requirements/gate0.lock
      - scripts/check_post_mega17_reconciliation_junit.py
      - scripts/post_mega17_receipt_reconciliation.py
      - tests/contracts/post_mega17_receipt_reconciliation_expected_nodeids.txt
      - tests/contracts/test_post_mega17_receipt_reconciliation.py
      - tests/contracts/test_post_mega17_reconciliation_workflow.py

permissions:
  contents: read

concurrency:
  group: post-mega17-reconciliation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconciliation-contract:
    name: Task 5 contract / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/gate0.lock

      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/gate0.lock

      - name: Collect and verify the exact contract test population
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          test_module='tests/contracts/test_post_mega17_receipt_reconciliation.py'
          expected_nodeids='tests/contracts/post_mega17_receipt_reconciliation_expected_nodeids.txt'
          if [[ ! -f "$test_module" ]]; then
            echo "::error::Required Task 5 test module is missing: $test_module"
            exit 1
          fi
          if [[ ! -f "$expected_nodeids" ]]; then
            echo "::error::Pinned Task 5 node population is missing: $expected_nodeids"
            exit 1
          fi
          collection_output="${RUNNER_TEMP}/post-mega17-reconciliation-collection.txt"
          collected_nodeids="${RUNNER_TEMP}/post-mega17-reconciliation-collected-nodeids.txt"
          python -m pytest --collect-only -q "$test_module" > "$collection_output"
          python - "$collection_output" "$collected_nodeids" <<'PY'
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          nodes = [line for line in lines if line.startswith("tests/contracts/")]
          if not nodes or len(nodes) != len(set(nodes)):
              raise SystemExit("collection produced no nodes or duplicate node identities")
          Path(sys.argv[2]).write_text("\n".join(nodes) + "\n", encoding="utf-8")
          PY
          diff -u "$expected_nodeids" "$collected_nodeids"

      - name: Run the Task 5 reconciliation contract tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest -q \
            --junitxml="${RUNNER_TEMP}/post-mega17-reconciliation-junit.xml" \
            tests/contracts/test_post_mega17_receipt_reconciliation.py

      - name: Verify exact JUnit outcomes
        if: always()
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python scripts/check_post_mega17_reconciliation_junit.py
          --junit "${RUNNER_TEMP}/post-mega17-reconciliation-junit.xml"
          --expected-nodeids tests/contracts/post_mega17_receipt_reconciliation_expected_nodeids.txt

      - name: Publish interpreter-specific JUnit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-mega17-reconciliation-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/post-mega17-reconciliation-junit.xml
          if-no-files-found: error
          retention-days: 14
